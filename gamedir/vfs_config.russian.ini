[vfs_config]
LANGUAGE = russian

[PROFILE_Vanilla]
LOCATIONS += russian_data_slf, russian_russian_slf, russian_Base

[PROFILE_v113]
LOCATIONS += russian_v113

[PROFILE_UB]
LOCATIONS += russian_UB, russian_UB_Vanilla

[PROFILE_UBv113]
