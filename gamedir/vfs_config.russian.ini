PATH = russian\Base

[LOC_russian_v113]
TYPE = DIRECTORY
PATH = russian\Data-1.13

[LOC_russian_UB]
TYPE = DIRECTORY
PATH = russian\Data-UB

[LOC_russian_UB_v1_13]
